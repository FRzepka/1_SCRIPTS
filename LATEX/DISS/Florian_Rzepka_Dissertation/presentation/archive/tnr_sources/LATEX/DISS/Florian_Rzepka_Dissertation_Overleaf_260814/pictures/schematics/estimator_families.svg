<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="450" viewBox="0 0 1400 450">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2f2f2f"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #1f1f1f; }
      .heading { font-size: 27px; font-weight: 700; }
      .body { font-size: 22px; }
      .box { stroke-width: 2.2; }
      .flow { fill: none; stroke: #2f2f2f; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="30" y="35" width="380" height="135" rx="5" class="box" fill="#f5f5f5" stroke="#4f4f4f"/>
  <text x="220" y="77" text-anchor="middle" class="label heading">Direct measurement</text>
  <text x="220" y="113" text-anchor="middle" class="label body">Coulomb counting</text>
  <text x="220" y="145" text-anchor="middle" class="label body">OCV anchoring</text>

  <rect x="510" y="35" width="380" height="135" rx="5" class="box" fill="#f5f5f5" stroke="#4f4f4f"/>
  <text x="700" y="77" text-anchor="middle" class="label heading">Model-based</text>
  <text x="700" y="113" text-anchor="middle" class="label body">ECM observers</text>
  <text x="700" y="145" text-anchor="middle" class="label body">physical states</text>

  <rect x="990" y="35" width="380" height="135" rx="5" class="box" fill="#f5f5f5" stroke="#4f4f4f"/>
  <text x="1180" y="77" text-anchor="middle" class="label heading">Data-driven</text>
  <text x="1180" y="113" text-anchor="middle" class="label body">MLP, GRU, and LSTM</text>
  <text x="1180" y="145" text-anchor="middle" class="label body">learned mappings</text>

  <rect x="190" y="285" width="1020" height="120" rx="5" class="box" fill="#e9f8f9" stroke="#00a6b3"/>
  <text x="700" y="330" text-anchor="middle" class="label heading">Hybrid estimators</text>
  <text x="700" y="368" text-anchor="middle" class="label body">measurement integration and physical models combined with adaptive or learned support</text>

  <path d="M220 170 L220 225 L440 225 L440 285" class="flow"/>
  <path d="M700 170 L700 285" class="flow"/>
  <path d="M1180 170 L1180 225 L960 225 L960 285" class="flow"/>
</svg>
