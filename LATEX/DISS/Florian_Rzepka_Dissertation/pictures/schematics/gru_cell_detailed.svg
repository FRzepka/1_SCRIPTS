<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#171717"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#b51f24"/>
    </marker>
    <style>
      .signal { fill: none; stroke: #171717; stroke-width: 3.5; stroke-linejoin: miter; stroke-linecap: square; }
      .signal-arrow { fill: none; stroke: #171717; stroke-width: 3.5; stroke-linejoin: miter; stroke-linecap: square; marker-end: url(#arrow); }
      .gate-signal { fill: none; stroke: #b51f24; stroke-width: 3.5; stroke-linejoin: miter; stroke-linecap: square; marker-end: url(#arrow-red); }
      .frame { fill: #f3f3f3; stroke: #171717; stroke-width: 4; }
      .gate { fill: #f8e1e1; stroke: #b51f24; stroke-width: 3; }
      .state { fill: #ffffff; stroke: #171717; stroke-width: 3; }
      .operator { fill: #ffffff; stroke: #171717; stroke-width: 3; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #171717; font-size: 25px; }
      .label-bold { font-family: Arial, Helvetica, sans-serif; fill: #171717; font-size: 25px; font-weight: 700; }
      .math { font-family: "Times New Roman", Times, serif; fill: #171717; font-size: 30px; font-style: italic; }
      .math-red { font-family: "Times New Roman", Times, serif; fill: #9d1b20; font-size: 28px; font-style: italic; }
      .operator-text { font-family: Arial, Helvetica, sans-serif; fill: #171717; font-size: 34px; font-weight: 600; }
      .formula { font-family: "Times New Roman", Times, serif; fill: #171717; font-size: 29px; font-style: italic; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#ffffff"/>
  <rect class="frame" x="130" y="55" width="1340" height="565"/>

  <!-- Previous hidden state and retained-state branch -->
  <path class="signal-arrow" d="M35 150 H950"/>
  <rect class="operator" x="950" y="120" width="60" height="60"/>
  <text class="operator-text" x="980" y="161" text-anchor="middle">×</text>
  <path class="signal" d="M1010 150 H1270 V210"/>
  <text class="math" x="38" y="126">hₜ₋₁</text>

  <!-- Reset branch -->
  <path class="signal" d="M260 150 V275 H410"/>
  <rect class="operator" x="410" y="245" width="60" height="60"/>
  <text class="operator-text" x="440" y="286" text-anchor="middle">×</text>

  <rect class="gate" x="325" y="420" width="230" height="88"/>
  <text class="label-bold" x="440" y="454" text-anchor="middle">Reset gate</text>
  <text class="math-red" x="440" y="489" text-anchor="middle">rₜ = σ(·)</text>
  <path class="gate-signal" d="M440 420 V305"/>
  <text class="math-red" x="454" y="371">rₜ</text>

  <!-- Update gate and complementary branch -->
  <rect class="gate" x="595" y="420" width="230" height="88"/>
  <text class="label-bold" x="710" y="454" text-anchor="middle">Update gate</text>
  <text class="math-red" x="710" y="489" text-anchor="middle">zₜ = σ(·)</text>

  <path class="gate-signal" d="M710 420 V345 H835"/>
  <rect class="operator" x="835" y="315" width="105" height="60"/>
  <text class="math-red" x="887" y="355" text-anchor="middle">1 − zₜ</text>

  <rect x="752" y="266" width="16" height="18" fill="#f3f3f3"/>
  <path class="gate-signal" d="M760 345 V205 H980 V180"/>
  <text class="math-red" x="775" y="236">zₜ</text>

  <!-- Candidate hidden state -->
  <path class="signal" d="M470 275 H930 V420"/>
  <rect class="state" x="855" y="420" width="300" height="88"/>
  <text class="label-bold" x="1005" y="454" text-anchor="middle">Candidate hidden state</text>
  <text class="math" x="1005" y="489" text-anchor="middle">h̃ₜ = tanh(·)</text>

  <rect class="operator" x="1050" y="315" width="60" height="60"/>
  <text class="operator-text" x="1080" y="356" text-anchor="middle">×</text>
  <path class="gate-signal" d="M940 345 H1050"/>
  <path class="signal-arrow" d="M1005 420 V395 H1080 V375"/>

  <!-- Combination and current hidden state -->
  <path class="signal" d="M1080 315 V275 H1270 V270"/>
  <rect class="operator" x="1240" y="210" width="60" height="60"/>
  <text class="operator-text" x="1270" y="251" text-anchor="middle">+</text>
  <path class="signal-arrow" d="M1300 240 H1535"/>
  <text class="math" x="1494" y="216">hₜ</text>

  <!-- Shared current input and previous hidden state -->
  <path class="signal" d="M185 150 V558"/>
  <path class="signal" d="M185 632 V558"/>
  <path class="signal" d="M185 558 H1430"/>
  <rect x="180" y="553" width="10" height="10" fill="#171717"/>
  <text class="math" x="145" y="610">xₜ</text>
  <text class="label" x="805" y="598" text-anchor="middle">gate inputs [xₜ, hₜ₋₁]</text>

  <path class="signal-arrow" d="M440 558 V508"/>
  <path class="signal-arrow" d="M710 558 V508"/>
  <path class="signal-arrow" d="M1005 558 V508"/>

  <!-- Compact state equations -->
  <line x1="130" y1="640" x2="1470" y2="640" stroke="#c9c9c9" stroke-width="2"/>
  <text class="formula" x="180" y="707" style="font-size:27px">h̃ₜ = tanh(Wₕxₜ + Uₕ(rₜ ⊙ hₜ₋₁) + bₕ)</text>
  <text class="formula" x="880" y="707" style="font-size:27px">hₜ = (1 − zₜ) ⊙ h̃ₜ + zₜ ⊙ hₜ₋₁</text>
</svg>
