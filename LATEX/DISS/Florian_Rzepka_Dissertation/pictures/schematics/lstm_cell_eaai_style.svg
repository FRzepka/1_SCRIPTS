<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#5f9dc9"/>
    </marker>
    <style>
      .frame {
        fill: none;
        stroke: #424242;
        stroke-width: 5;
      }
      .signal {
        fill: none;
        stroke: #5f9dc9;
        stroke-width: 4;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .signal-arrow {
        fill: none;
        stroke: #5f9dc9;
        stroke-width: 4;
        stroke-linecap: square;
        stroke-linejoin: miter;
        marker-end: url(#arrow-blue);
      }
      .gate {
        fill: #ffffff;
        stroke: #424242;
        stroke-width: 4;
      }
      .operator {
        fill: #ffffff;
        stroke: #424242;
        stroke-width: 4;
      }
      .title {
        font-family: "Times New Roman", Times, serif;
        font-size: 34px;
        font-weight: 700;
        fill: #424242;
        text-anchor: middle;
      }
      .math {
        font-family: "Times New Roman", Times, serif;
        font-size: 31px;
        font-style: italic;
        fill: #424242;
      }
      .small-math {
        font-family: "Times New Roman", Times, serif;
        font-size: 26px;
        font-style: italic;
        fill: #424242;
      }
      .gate-text {
        font-family: "Times New Roman", Times, serif;
        font-size: 39px;
        font-style: italic;
        font-weight: 700;
        fill: #424242;
        text-anchor: middle;
      }
      .op-text {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 34px;
        fill: #424242;
        text-anchor: middle;
      }
    </style>
  </defs>

  <text class="title" x="600" y="42">LSTM</text>
  <rect class="frame" x="180" y="70" width="840" height="480" rx="72" ry="72"/>

  <!-- Cell-state path -->
  <text class="math" x="43" y="165">cₜ₋₁</text>
  <path class="signal-arrow" d="M128 175 H272"/>
  <circle class="operator" cx="300" cy="175" r="28"/>
  <text class="op-text" x="300" y="187">×</text>
  <path class="signal-arrow" d="M328 175 H572"/>
  <circle class="operator" cx="600" cy="175" r="28"/>
  <text class="op-text" x="600" y="187">+</text>
  <path class="signal-arrow" d="M628 175 H1150"/>
  <text class="math" x="1084" y="157">cₜ</text>

  <!-- Forget gate -->
  <rect class="gate" x="260" y="340" width="80" height="76" rx="9" ry="9"/>
  <text class="gate-text" x="300" y="391">σ</text>
  <path class="signal-arrow" d="M300 340 V203"/>
  <text class="small-math" x="318" y="278">fₜ</text>

  <!-- Input gate and candidate -->
  <rect class="gate" x="430" y="340" width="80" height="76" rx="9" ry="9"/>
  <text class="gate-text" x="470" y="391">σ</text>
  <rect class="gate" x="550" y="340" width="100" height="76" rx="9" ry="9"/>
  <text class="gate-text" x="600" y="391">tanh</text>

  <circle class="operator" cx="600" cy="260" r="28"/>
  <text class="op-text" x="600" y="272">×</text>
  <path class="signal-arrow" d="M470 340 V260 H572"/>
  <path class="signal-arrow" d="M600 340 V288"/>
  <path class="signal-arrow" d="M600 232 V203"/>
  <text class="small-math" x="518" y="246">iₜ</text>
  <text class="small-math" x="618" y="320">c̃ₜ</text>

  <!-- Output gate -->
  <rect class="gate" x="735" y="340" width="80" height="76" rx="9" ry="9"/>
  <text class="gate-text" x="775" y="391">σ</text>

  <path class="signal" d="M910 175 V240"/>
  <rect class="gate" x="865" y="240" width="90" height="70" rx="9" ry="9"/>
  <text class="gate-text" x="910" y="287">tanh</text>
  <path class="signal-arrow" d="M910 310 V347"/>

  <circle class="operator" cx="910" cy="375" r="28"/>
  <text class="op-text" x="910" y="387">×</text>
  <path class="signal-arrow" d="M815 378 H882"/>

  <!-- Shared current input and previous hidden state -->
  <text class="math" x="43" y="447">hₜ₋₁</text>
  <path class="signal-arrow" d="M128 455 H180"/>
  <path class="signal" d="M180 455 H775 V416"/>
  <path class="signal" d="M300 455 V416"/>
  <path class="signal" d="M470 455 V416"/>
  <path class="signal" d="M600 455 V416"/>
  <circle cx="300" cy="455" r="7" fill="#5f9dc9"/>

  <text class="math" x="270" y="610">xₜ</text>
  <path class="signal-arrow" d="M300 580 V462"/>

  <!-- Exposed hidden state -->
  <path class="signal" d="M910 403 V455"/>
  <path class="signal-arrow" d="M910 455 H1150"/>
  <text class="math" x="1084" y="437">hₜ</text>
</svg>
