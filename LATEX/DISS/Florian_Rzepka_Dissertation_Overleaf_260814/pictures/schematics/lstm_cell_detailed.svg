<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#171717"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#b51f24"/>
    </marker>
    <style>
      .signal { fill: none; stroke: #171717; stroke-width: 3.5; stroke-linejoin: miter; stroke-linecap: square; }
      .signal-arrow { fill: none; stroke: #171717; stroke-width: 3.5; stroke-linejoin: miter; stroke-linecap: square; marker-end: url(#arrow); }
      .gate-signal { fill: none; stroke: #b51f24; stroke-width: 3.5; stroke-linejoin: miter; stroke-linecap: square; marker-end: url(#arrow-red); }
      .frame { fill: #f3f3f3; stroke: #171717; stroke-width: 4; }
      .gate { fill: #f8e1e1; stroke: #b51f24; stroke-width: 3; }
      .state { fill: #ffffff; stroke: #171717; stroke-width: 3; }
      .operator { fill: #ffffff; stroke: #171717; stroke-width: 3; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #171717; font-size: 25px; }
      .label-bold { font-family: Arial, Helvetica, sans-serif; fill: #171717; font-size: 25px; font-weight: 700; }
      .math { font-family: "Times New Roman", Times, serif; fill: #171717; font-size: 30px; font-style: italic; }
      .math-red { font-family: "Times New Roman", Times, serif; fill: #9d1b20; font-size: 28px; font-style: italic; }
      .operator-text { font-family: Arial, Helvetica, sans-serif; fill: #171717; font-size: 34px; font-weight: 600; }
      .formula { font-family: "Times New Roman", Times, serif; fill: #171717; font-size: 30px; font-style: italic; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#ffffff"/>
  <rect class="frame" x="130" y="55" width="1340" height="565"/>

  <!-- Cell-state highway -->
  <path class="signal-arrow" d="M35 150 H330"/>
  <rect class="operator" x="330" y="120" width="60" height="60"/>
  <text class="operator-text" x="360" y="161" text-anchor="middle">×</text>
  <path class="signal" d="M390 150 H920"/>
  <rect class="operator" x="920" y="120" width="60" height="60"/>
  <text class="operator-text" x="950" y="161" text-anchor="middle">+</text>
  <path class="signal-arrow" d="M980 150 H1535"/>
  <text class="math" x="38" y="126">cₜ₋₁</text>
  <text class="math" x="1494" y="126">cₜ</text>

  <!-- Forget gate -->
  <rect class="gate" x="245" y="420" width="230" height="88"/>
  <text class="label-bold" x="360" y="454" text-anchor="middle">Forget gate</text>
  <text class="math-red" x="360" y="489" text-anchor="middle">fₜ = σ(·)</text>
  <path class="gate-signal" d="M360 420 V180"/>
  <text class="math-red" x="374" y="229">fₜ</text>

  <!-- Input gate and candidate state -->
  <rect class="gate" x="485" y="420" width="210" height="88"/>
  <text class="label-bold" x="590" y="454" text-anchor="middle">Input gate</text>
  <text class="math-red" x="590" y="489" text-anchor="middle">iₜ = σ(·)</text>

  <rect class="state" x="715" y="420" width="220" height="88"/>
  <text class="label-bold" x="825" y="454" text-anchor="middle">Candidate state</text>
  <text class="math" x="825" y="489" text-anchor="middle">gₜ = tanh(·)</text>

  <rect class="operator" x="795" y="260" width="60" height="60"/>
  <text class="operator-text" x="825" y="301" text-anchor="middle">×</text>
  <path class="gate-signal" d="M590 420 V290 H795"/>
  <path class="signal-arrow" d="M825 420 V320"/>
  <text class="math-red" x="604" y="322">iₜ</text>
  <text class="math" x="839" y="377">gₜ</text>
  <path class="signal-arrow" d="M855 290 H895 V150 H920"/>

  <!-- Output gate and hidden-state construction -->
  <path class="signal" d="M1070 150 V245"/>
  <rect class="state" x="1010" y="245" width="120" height="68"/>
  <text class="math" x="1070" y="289" text-anchor="middle">tanh</text>
  <path class="signal-arrow" d="M1130 279 H1235"/>

  <rect class="operator" x="1235" y="249" width="60" height="60"/>
  <text class="operator-text" x="1265" y="290" text-anchor="middle">×</text>
  <path class="signal-arrow" d="M1295 279 H1535"/>
  <text class="math" x="1494" y="255">hₜ</text>

  <rect class="gate" x="1150" y="420" width="230" height="88"/>
  <text class="label-bold" x="1265" y="454" text-anchor="middle">Output gate</text>
  <text class="math-red" x="1265" y="489" text-anchor="middle">oₜ = σ(·)</text>
  <path class="gate-signal" d="M1265 420 V309"/>
  <text class="math-red" x="1279" y="377">oₜ</text>

  <!-- Shared current input and previous hidden state -->
  <path class="signal" d="M35 558 H185"/>
  <path class="signal" d="M185 632 V558"/>
  <path class="signal" d="M185 558 H1430"/>
  <rect x="180" y="553" width="10" height="10" fill="#171717"/>
  <text class="math" x="38" y="538">hₜ₋₁</text>
  <text class="math" x="145" y="610">xₜ</text>
  <text class="label" x="805" y="598" text-anchor="middle">gate inputs [xₜ, hₜ₋₁]</text>

  <path class="signal-arrow" d="M360 558 V508"/>
  <path class="signal-arrow" d="M590 558 V508"/>
  <path class="signal-arrow" d="M825 558 V508"/>
  <path class="signal-arrow" d="M1265 558 V508"/>

  <!-- Compact state equations -->
  <line x1="130" y1="640" x2="1470" y2="640" stroke="#c9c9c9" stroke-width="2"/>
  <text class="formula" x="260" y="707">cₜ = fₜ ⊙ cₜ₋₁ + iₜ ⊙ gₜ</text>
  <text class="formula" x="960" y="707">hₜ = oₜ ⊙ tanh(cₜ)</text>
</svg>
