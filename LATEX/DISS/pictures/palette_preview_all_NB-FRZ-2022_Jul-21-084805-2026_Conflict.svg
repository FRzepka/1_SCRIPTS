<rect x="1040" y="1165" width="92" height="46" rx="4" fill="#2f7898" stroke="#222" stroke-width="0.5"/>
<text class="small" x="1086.0" y="1232.0" text-anchor="middle">#2f7898</text>
<rect x="1195" y="1165" width="92" height="46" rx="4" fill="#6f9a63" stroke="#222" stroke-width="0.5"/>
<text class="small" x="1241.0" y="1232.0" text-anchor="middle">#6f9a63</text>
<rect x="730" y="1242" width="62" height="22" rx="3" fill="#000000" stroke="#222" stroke-width="0.5"/>
<text class="small" x="806.0" y="1259.0" text-anchor="start">#000000</text>
<rect x="835" y="1242" width="62" height="22" rx="3" fill="#434343" stroke="#222" stroke-width="0.5"/>
<text class="small" x="911.0" y="1259.0" text-anchor="start">#434343</text>
<rect x="940" y="1242" width="62" height="22" rx="3" fill="#b2b2b2" stroke="#222" stroke-width="0.5"/>
<text class="small" x="1016.0" y="1259.0" text-anchor="start">#b2b2b2</text>
<text class="panel" x="40.0" y="1294.0" text-anchor="start">12_tu_red_colorblind_safe: TU red plus colorblind-safe accents</text>
<text class="small" x="40.0" y="1324.0" text-anchor="start">Scientific/high-contrast option: TU red combined with blue, green, and ochre accents. Best candidate when lines overlap heavily.</text>
<rect x="730" y="1270" width="92" height="46" rx="4" fill="#b6302d" stroke="#222" stroke-width="0.5"/>
<text class="small" x="776.0" y="1337.0" text-anchor="middle">#b6302d</text>
<rect x="885" y="1270" width="92" height="46" rx="4" fill="#0072b2" stroke="#222" stroke-width="0.5"/>
<text class="small" x="931.0" y="1337.0" text-anchor="middle">#0072b2</text>
<rect x="1040" y="1270" width="92" height="46" rx="4" fill="#009e73" stroke="#222" stroke-width="0.5"/>
<text class="small" x="1086.0" y="1337.0" text-anchor="middle">#009e73</text>
<rect x="1195" y="1270" width="92" height="46" rx="4" fill="#e69f00" stroke="#222" stroke-width="0.5"/>
<text class="small" x="1241.0" y="1337.0" text-anchor="middle">#e69f00</text>
<rect x="730" y="1347" width="62" height="22" rx="3" fill="#000000" stroke="#222" stroke-width="0.5"/>
<text class="small" x="806.0" y="1364.0" text-anchor="start">#000000</text>
<rect x="835" y="1347" width="62" height="22" rx="3" fill="#434343" stroke="#222" stroke-width="0.5"/>
<text class="small" x="911.0" y="1364.0" text-anchor="start">#434343</text>
<rect x="940" y="1347" width="62" height="22" rx="3" fill="#b2b2b2" stroke="#222" stroke-width="0.5"/>
<text class="small" x="1016.0" y="1364.0" text-anchor="start">#b2b2b2</text>
<text class="panel" x="40.0" y="1399.0" text-anchor="start">13_tu_red_muted_purple_green: TU red muted with purple and soft green</text>
<text class="small" x="40.0" y="1429.0" text-anchor="start">Close to the current red-muted style, but the rose and brown-gray slots are replaced by muted purple and a softer light green for clearer M1/M2/M3 separation.</text>
<rect x="730" y="1375" width="92" height="46" rx="4" fill="#b6302d" stroke="#222" stroke-width="0.5"/>
<text class="small" x="776.0" y="1442.0" text-anchor="middle">#b6302d</text>
<rect x="885" y="1375" width="92" height="46" rx="4" fill="#7f5f9f" stroke="#222" stroke-width="0.5"/>
<text class="small" x="931.0" y="1442.0" text-anchor="middle">#7f5f9f</text>
<rect x="1040" y="1375" width="92" height="46" rx="4" fill="#8fbf8a" stroke="#222" stroke-width="0.5"/>
<text class="small" x="1086.0" y="1442.0" text-anchor="middle">#8fbf8a</text>
<rect x="1195" y="1375" width="92" height="46" rx="4" fill="#566b78" stroke="#222" stroke-width="0.5"/>
<text class="small" x="1241.0" y="1442.0" text-anchor="middle">#566b78</text>
<rect x="730" y="1452" width="62" height="22" rx="3" fill="#000000" stroke="#222" stroke-width="0.5"/>
<text class="small" x="806.0" y="1469.0" text-anchor="start">#000000</text>
<rect x="835" y="1452" width="62" height="22" rx="3" fill="#434343" stroke="#222" stroke-width="0.5"/>
<text class="small" x="911.0" y="1469.0" text-anchor="start">#434343</text>
<rect x="940" y="1452" width="62" height="22" rx="3" fill="#b2b2b2" stroke="#222" stroke-width="0.5"/>
<text class="small" x="1016.0" y="1469.0" text-anchor="start">#b2b2b2</text>
<text class="panel" x="40.0" y="1504.0" text-anchor="start">14_tu_red_muted_purple_m2: TU red muted with purple M2</text>
<text class="small" x="40.0" y="1534.0" text-anchor="start">Minimal variant of the current red-muted palette: M1, M3, and M4 stay unchanged, while the rose M2 is replaced by muted purple.</text>
<rect x="730" y="1480" width="92" height="46" rx="4" fill="#b6302d" stroke="#222" stroke-width="0.5"/>
<text class="small" x="776.0" y="1547.0" text-anchor="middle">#b6302d</text>
<rect x="885" y="1480" width="92" height="46" rx="4" fill="#7f5f9f" stroke="#222" stroke-width="0.5"/>
<text class="small" x="931.0" y="1547.0" text-anchor="middle">#7f5f9f</text>
<rect x="1040" y="1480" width="92" height="46" rx="4" fill="#8b6763" stroke="#222" stroke-width="0.5"/>
<text class="small" x="1086.0" y="1547.0" text-anchor="middle">#8b6763</text>
<rect x="1195" y="1480" width="92" height="46" rx="4" fill="#566b78" stroke="#222" stroke-width="0.5"/>
<text class="small" x="1241.0" y="1547.0" text-anchor="middle">