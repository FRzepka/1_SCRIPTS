<text class="title" x="40" y="42">Color-palette candidates for dissertation figures</text>
<text class="label" x="40" y="68">Palette 16 contains the EAAI colours plus light fills for bars, boxes, and histograms.</text>
<text class="panel" x="40" y="139" text-anchor="start">01_tu_red_muted: TU red muted categorical</text>
<text class="small" x="40" y="169" text-anchor="start">Main recommendation for four estimator classes: TU red, muted rose, desaturated brown-gray, and blue-gray.</text>
